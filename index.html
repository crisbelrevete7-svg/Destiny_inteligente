<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e1a47">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Destiny</title>
<style>
:root{--bg:#f5f1fc;--card:#fff;--ink:#1e1530;--mute:#6b5d85;--violet:#7b4fd6;--on:#fff;--lav:#e4d9f8;--line:#d9cdef}
@media(prefers-color-scheme:dark){:root{--bg:#171021;--card:#241a35;--ink:#f1eafc;--mute:#a999c7;--violet:#a98bf0;--on:#1e1530;--lav:#33264a;--line:#3d2e57}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main,aside{display:flex;flex-direction:column;min-height:0;min-width:0}
main{padding:16px 20px 12px}
h1{margin:0 0 12px;font-size:1.5rem;letter-spacing:-.01em}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 12px}
.m{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--violet);color:var(--on);border-bottom-right-radius:4px}
.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.a.err{border-color:#c0392b}
.empty{color:var(--mute);margin:auto;text-align:center;max-width:32ch}
form{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer}
form button{padding:0 18px;border:0;border-radius:12px;background:var(--violet);color:var(--on);font-weight:600}
form button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
aside{background:var(--card);border-left:1px solid var(--line);padding:16px;overflow-y:auto}
h2{font-size:1rem;margin:16px 0 6px}
h2:first-child{margin-top:0}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
li span{flex:1;overflow-wrap:anywhere}
li small{display:block;color:var(--mute)}
li button{border:0;background:none;color:var(--mute);padding:2px 6px;border-radius:6px}
li.done span{text-decoration:line-through;color:var(--mute)}
.none{color:var(--mute);font-size:.9rem;padding:4px 0}
header{display:flex;align-items:center;gap:14px;margin-bottom:12px}
header h1{margin:0;flex:1}
.orb{--s:1;position:relative;width:56px;height:56px;border-radius:50%;flex:0 0 auto;background:radial-gradient(circle at 35% 30%,#e4d9f8,#a98bf0 45%,#5b2fb3);transform:scale(var(--s));transition:transform .12s ease-out,box-shadow .2s}
.orb::before,.orb::after{content:"";position:absolute;top:40%;width:7px;height:10px;border-radius:50%;background:#2e1a47}
.orb::before{left:30%}.orb::after{right:30%}
.orb[data-st=listening]{animation:ring 1.2s infinite}
.orb[data-st=speaking]{box-shadow:0 0 22px 6px rgba(169,139,240,.55)}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(123,79,214,.55)}70%,100%{box-shadow:0 0 0 16px rgba(123,79,214,0)}}
@media(prefers-reduced-motion:reduce){.orb{transition:none}.orb[data-st=listening]{animation:none;box-shadow:0 0 0 6px rgba(123,79,214,.45)}}
.tg{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px}
.tg[aria-pressed=false]{color:var(--mute)}
#mic{width:48px;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
#mic[aria-pressed=true]{background:var(--violet);color:var(--on)}
#tabs{display:none}
@media(max-width:800px){
 body{grid-template-columns:1fr;grid-template-rows:1fr auto}
 aside{border-left:0}
 body[data-v=chat] aside,body[data-v=panel] main{display:none}
 #tabs{display:flex;border-top:1px solid var(--line);background:var(--card)}
 #tabs button{flex:1;padding:12px;border:0;background:none;color:var(--mute)}
 #tabs button[aria-pressed=true]{color:var(--violet);font-weight:700}
}
@media(prefers-reduced-motion:no-preference){.m{animation:in .15s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}}}
</style>
</head>
<body data-v="chat">
<main>
  <header>
    <div class="orb" id="orb" data-st="idle" role="img" aria-label="Avatar de Destiny"></div>
    <h1>Destiny</h1>
    <span class="tg" id="net" hidden>Sin conexión</span>
    <button type="button" class="tg" id="vz" aria-pressed="true">Voz activada</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="f">
    <input id="q" placeholder="Agéndame dentista el viernes a las 4" autocomplete="off" aria-label="Mensaje">
    <button type="button" id="mic" aria-pressed="false" aria-label="Hablar" title="Hablar">🎤</button>
    <button id="s">Enviar</button>
  </form>
</main>
<aside id="panel"></aside>
<nav id="tabs">
  <button data-v="chat" aria-pressed="true">Chat</button>
  <button data-v="panel" aria-pressed="false">Agenda</button>
</nav>
<script src="jspdf.umd.min.js"></script>
<script>window.jspdf||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"><\/script>')</script>
<script>
const KEY = 'destiny-data';
const blank = () => ({ eventos: [], tareas: [], notas: [], recordatorios: [], avisados: [] });
let db;
try { db = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch { db = blank(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} };
const uid = () => Math.random().toString(36).slice(2, 9);

const tools = {
  crear_evento: a => { const id = uid(); db.eventos.push({ id, titulo: a.titulo, fecha: a.fecha, hora: a.hora || '', antes: a.avisar_minutos_antes }); quiet('e' + id); return 'Evento creado'; },
  crear_tarea: a => { const id = uid(); db.tareas.push({ id, titulo: a.titulo, fecha: a.fecha_limite || '', hecha: false }); quiet('t' + id); return 'Tarea creada'; },
  crear_nota: a => { db.notas.push({ id: uid(), titulo: a.titulo, texto: a.texto || '' }); return 'Nota creada'; },
  crear_recordatorio: a => { const id = uid(); db.recordatorios.push({ id, texto: a.texto, fecha: a.fecha, hora: a.hora || '' }); quiet('r' + id); return 'Recordatorio creado'; },
  editar_elemento: a => {
    const f = buscarItem(a.tipo, a.buscar); if (f.err) return f.err; const it = f.it;
    if (a.nuevo_titulo) { if (f.key === 'recordatorios') it.texto = a.nuevo_titulo; else it.titulo = a.nuevo_titulo; }
    if (a.fecha && f.key !== 'notas') it.fecha = a.fecha;
    if (a.hora != null && (f.key === 'eventos' || f.key === 'recordatorios')) it.hora = a.hora;
    if (a.texto != null && f.key === 'notas') it.texto = a.texto;
    rearmar(f.key, it); return 'Actualizado';
  },
  completar_tarea: a => {
    const f = buscarItem('tarea', a.buscar); if (f.err) return f.err;
    f.it.hecha = a.hecha !== false; return f.it.hecha ? 'Tarea marcada como hecha' : 'Tarea marcada como pendiente';
  },
  borrar_elemento: a => {
    const f = buscarItem(a.tipo, a.buscar); if (f.err) return f.err;
    db[f.key] = db[f.key].filter(o => o !== f.it); db.avisados = db.avisados.filter(k => k !== PREF[f.key] + f.it.id); return 'Borrado';
  },
  ver_agenda: () => JSON.stringify({ eventos: db.eventos, tareas: db.tareas, notas: db.notas, recordatorios: db.recordatorios }),
  generar_pdf: a => makePDF(a.contenido || 'todo'),
};

const $ = s => document.querySelector(s);
const log = $('#log'), panel = $('#panel');
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function bubble(text, cls) {
  const e = log.querySelector('.empty'); if (e) e.remove();
  const b = el('div', 'm ' + cls, text); log.append(b); log.scrollTop = log.scrollHeight; return b;
}

function section(title, key, items, line) {
  panel.append(el('h2', '', title));
  if (!items.length) { panel.append(el('div', 'none', 'Todavía no hay nada.')); return; }
  const ul = el('ul');
  items.forEach(it => {
    const li = el('li', it.hecha ? 'done' : '');
    if (key === 'tareas') {
      const c = el('input'); c.type = 'checkbox'; c.checked = !!it.hecha; c.style.flex = '0 0 auto';
      c.setAttribute('aria-label', 'Marcar tarea como hecha');
      c.onchange = () => { it.hecha = c.checked; save(); render(); };
      li.append(c);
    }
    const s = el('span', '', it.titulo); const [sub] = [line(it)];
    if (sub) s.append(el('small', '', sub));
    const x = el('button', '', 'Borrar'); x.onclick = () => { db[key] = db[key].filter(o => o.id !== it.id); save(); render(); };
    li.append(s, x); ul.append(li);
  });
  panel.append(ul);
}

function render() {
  panel.replaceChildren();
  const pb = el('button', 'tg', 'Descargar PDF');
  pb.onclick = () => { try { makePDF('todo'); } catch (e) { alert(e.message); } };
  const bell = el('button', 'tg', !('Notification' in window) ? 'Avisos no disponibles' : Notification.permission === 'granted' ? 'Avisos activados' : 'Activar avisos');
  bell.onclick = () => { if ('Notification' in window) Notification.requestPermission().then(render); };
  const row = el('div'); row.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap'; row.append(pb, bell); panel.append(row);
  const byDate = (a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora);
  section('Eventos', 'eventos', [...db.eventos].sort(byDate), e => e.fecha + (e.hora ? ' · ' + e.hora : ''));
  section('Tareas', 'tareas', db.tareas, t => t.fecha ? 'Para el ' + t.fecha : '');
  section('Recordatorios', 'recordatorios', [...db.recordatorios].sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora)).map(r => ({ ...r, titulo: r.texto })), r => r.fecha + (r.hora ? ' · ' + r.hora : ''));
  section('Notas', 'notas', db.notas, n => n.texto);
}


// ---- PDF ----
function makePDF(what = 'todo') {
  if (!window.jspdf) throw new Error('No cargó la librería de PDF (jspdf.umd.min.js)');
  const doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 48;
  const clean = t => String(t == null ? '' : t).replace(/[^\x20-\x7E\u00A0-\u00FF]/g, '');
  let y;
  const header = () => {
    doc.setFillColor(46, 26, 71); doc.rect(0, 0, W, 86, 'F');
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(26); doc.text('Destiny', M, 52);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(228, 217, 248);
    doc.text(clean(new Date().toLocaleDateString('es', { dateStyle: 'full' })), W - M, 52, { align: 'right' });
    y = 124;
  };
  const room = n => { if (y + n > H - M) { doc.addPage(); header(); } };
  const section = (title, rgb, rows) => {
    room(70);
    doc.setFillColor(...rgb); doc.roundedRect(M, y - 14, 6, 20, 3, 3, 'F');
    doc.setTextColor(46, 26, 71); doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.text(title, M + 16, y + 2);
    y += 28;
    if (!rows.length) {
      doc.setFont('helvetica', 'italic'); doc.setFontSize(11); doc.setTextColor(120, 105, 150);
      doc.text('Nada por ahora.', M + 16, y); y += 30; return;
    }
    rows.forEach(([chip, text, sub]) => {
      const main = doc.splitTextToSize(clean(text), W - 2 * M - 130);
      const subL = sub ? doc.splitTextToSize(clean(sub), W - 2 * M - 130) : [];
      const h = main.length * 15 + subL.length * 13 + 14;
      room(h + 6);
      doc.setFillColor(245, 241, 252); doc.roundedRect(M, y - 12, W - 2 * M, h, 6, 6, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...rgb); doc.text(clean(chip), M + 12, y + 2);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(12); doc.setTextColor(30, 21, 48); doc.text(main, M + 130, y + 2);
      if (subL.length) { doc.setFontSize(10); doc.setTextColor(107, 93, 133); doc.text(subL, M + 130, y + 2 + main.length * 15); }
      y += h + 6;
    });
    y += 12;
  };
  header();
  const all = what === 'todo';
  if (all || what === 'eventos') section('Eventos', [123, 79, 214],
    [...db.eventos].sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora))
      .map(e => [e.fecha + (e.hora ? '  ' + e.hora : ''), e.titulo]));
  if (all || what === 'tareas') section('Tareas', [176, 70, 160],
    db.tareas.map(t => [t.hecha ? 'Hecha' : (t.fecha || 'Pendiente'), t.titulo]));
  if (all || what === 'notas') section('Notas', [80, 100, 200],
    db.notas.map(n => ['Nota', n.titulo, n.texto]));
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(150, 135, 180);
    doc.text(i + ' / ' + n, W / 2, H - 24, { align: 'center' });
  }
  doc.save('destiny-' + what + '-' + new Date().toISOString().slice(0, 10) + '.pdf');
  return 'PDF generado y descargado';
}

const hist = [];
async function ask() {
  for (let i = 0; i < 4; i++) {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: hist, ahora: new Date().toString() }),
    });
    const raw = await r.text();
    let data = {};
    try { data = JSON.parse(raw); } catch {}
    if (!r.ok || !data.message) throw new Error(data.error || (r.status === 404 || r.status === 405 || !raw
      ? 'No encontré el servidor (/api/chat). Con Live Server no funciona: usa "vercel dev" o la página ya subida a Vercel.'
      : 'Respuesta inesperada del servidor (' + r.status + ')'));
    hist.push(data.message);
    if (!data.message.tool_calls) return data.message.content;
    for (const c of data.message.tool_calls) {
      let out;
      try { out = tools[c.function.name](JSON.parse(c.function.arguments || '{}')); }
      catch (e) { out = 'Error: ' + e.message; }
      hist.push({ role: 'tool', tool_call_id: c.id, content: String(out) });
    }
    save(); render();
  }
  return 'Listo.';
}

$('#f').onsubmit = async ev => {
  ev.preventDefault();
  const q = $('#q'), text = q.value.trim(); if (!text) return;
  q.value = ''; $('#s').disabled = true;
  if (voiceOn && 'speechSynthesis' in window) { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance('')); }
  bubble(text, 'u'); hist.push({ role: 'user', content: text });
  const wait = bubble('Pensando…', 'a');
  try {
    let out;
    if (!navigator.onLine) out = runLocal(text);
    else { try { out = await ask(); } catch (e) { if (e instanceof TypeError) out = runLocal(text); else throw e; } }
    wait.textContent = out || 'Hecho.'; speak(wait.textContent);
  }
  catch (e) { wait.textContent = 'No pude responder: ' + e.message; wait.classList.add('err'); }
  $('#s').disabled = false; q.focus(); log.scrollTop = log.scrollHeight;
};

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.body.dataset.v = b.dataset.v;
  document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-pressed', x === b));
});

// ---- Voz y avatar ----
const orb = $('#orb'), vz = $('#vz'), mic = $('#mic');
const setSt = s => { orb.dataset.st = s; };
const lang = navigator.language.startsWith('es') ? navigator.language : 'es-ES';
let voiceOn = true, voice = null;
const hasTTS = 'speechSynthesis' in window;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => v.lang === lang) || vs.find(v => v.lang.startsWith('es')) || null;
}
if (hasTTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text) {
  if (!voiceOn || !hasTTS) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[*_#`>]/g, ''));
  u.lang = lang; if (voice) u.voice = voice;
  const calm = () => orb.style.setProperty('--s', 1);
  u.onstart = () => setSt('speaking');
  u.onboundary = () => { orb.style.setProperty('--s', 1 + Math.random() * .12); setTimeout(calm, 90); };
  u.onend = u.onerror = () => { calm(); setSt('idle'); };
  speechSynthesis.speak(u);
}
vz.onclick = () => {
  voiceOn = !voiceOn;
  vz.setAttribute('aria-pressed', voiceOn);
  vz.textContent = voiceOn ? 'Voz activada' : 'Voz apagada';
  if (!voiceOn && hasTTS) { speechSynthesis.cancel(); setSt('idle'); }
};
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) { mic.hidden = true; } else {
  const rec = new SR(); let on = false;
  rec.lang = lang; rec.interimResults = false; rec.continuous = false;
  rec.onstart = () => { on = true; mic.setAttribute('aria-pressed', true); setSt('listening'); };
  rec.onend = () => { on = false; mic.setAttribute('aria-pressed', false); if (orb.dataset.st === 'listening') setSt('idle'); };
  rec.onerror = e => bubble(
    e.error === 'not-allowed' ? 'Permite el micrófono en el navegador para poder hablarte.' :
    e.error === 'network' ? 'El reconocimiento de voz necesita internet.' :
    'No te escuché bien. Toca el micrófono e inténtalo de nuevo.', 'a err');
  rec.onresult = e => { $('#q').value = e.results[0][0].transcript; $('#f').requestSubmit(); };
  mic.onclick = () => { if (on) return rec.stop(); if (hasTTS) speechSynthesis.cancel(); rec.start(); };
}

// ---- Avisos y modo sin conexión ----
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const norm = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const DIAS = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

function agenda() {
  const out = [], T = (f, h) => new Date(f + 'T' + (h || '09:00') + ':00');
  db.eventos.forEach(e => { const t = T(e.fecha, e.hora); if (isNaN(t)) return; const antes = e.hora ? (e.antes == null ? 15 : e.antes) : 0;
    out.push({ key: 'e' + e.id, when: t - antes * 60000, title: e.titulo, body: e.hora ? (antes ? 'En ' + antes + ' min (' + e.hora + ')' : 'Ahora (' + e.hora + ')') : 'Es hoy' }); });
  db.tareas.forEach(t => { if (!t.fecha || t.hecha) return; const d = T(t.fecha); if (!isNaN(d)) out.push({ key: 't' + t.id, when: +d, title: t.titulo, body: 'Tarea para hoy' }); });
  db.recordatorios.forEach(r => { const d = T(r.fecha, r.hora); if (!isNaN(d)) out.push({ key: 'r' + r.id, when: +d, title: r.texto, body: 'Recordatorio' }); });
  return out;
}
function quiet(key) { // lo que ya pasó al crearlo no debe sonar de golpe
  const x = agenda().find(a => a.key === key);
  if (x && x.when <= Date.now() && !db.avisados.includes(key)) db.avisados.push(key);
}
async function notify(a) {
  bubble('🔔 ' + a.title + ' (' + a.body + ')', 'a');
  if (voiceOn && document.visibilityState === 'visible') speak('Recordatorio: ' + a.title);
  if ('Notification' in window && Notification.permission === 'granted') {
    const o = { body: a.body, icon: 'icon-192.png', tag: a.key };
    try { const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg) reg.showNotification(a.title, o); else new Notification(a.title, o); } catch {}
  }
}
function check() {
  const now = Date.now(); let ch = false;
  agenda().forEach(a => { if (a.when <= now && now - a.when < 864e5 && !db.avisados.includes(a.key)) { db.avisados.push(a.key); ch = true; notify(a); } });
  if (ch) { db.avisados = db.avisados.slice(-200); save(); }
}
setInterval(check, 20000);
document.addEventListener('visibilitychange', check);
setTimeout(check, 1500);

function cuando(txt) {
  let t = ' ' + txt + ' ', fecha = '', hora = '', now = new Date();
  const take = re => { const m = re.exec(norm(t)); if (m) t = t.slice(0, m.index) + ' ' + t.slice(m.index + m[0].length); return m; };
  const add = n => { const d = new Date(now); d.setDate(d.getDate() + n); return iso(d); };
  let m;
  if ((m = take(/(\d{4})-(\d{2})-(\d{2})/))) fecha = m[0];
  else if (take(/\bpasado manana\b/)) fecha = add(2);
  else if (take(/\bmanana\b/)) fecha = add(1);
  else if (take(/\bhoy\b/)) fecha = add(0);
  else if ((m = take(new RegExp('\\b(?:el )?(\\d{1,2}) de (' + MESES.join('|') + ')\\b')))) {
    let d = new Date(now.getFullYear(), MESES.indexOf(m[2]), +m[1]); if (d < new Date(iso(now) + 'T00:00:00')) d.setFullYear(d.getFullYear() + 1); fecha = iso(d);

const KINDS = { evento: 'eventos', cita: 'eventos', tarea: 'tareas', nota: 'notas', recordatorio: 'recordatorios' };
const PREF = { eventos: 'e', tareas: 't', recordatorios: 'r' };
function buscarItem(tipo, q) {
  const key = KINDS[norm(tipo || '')], nq = norm(q || '').trim();
  if (!key) return { err: 'Tipo no válido: usa evento, tarea, nota o recordatorio' };
  if (!nq) return { err: 'Falta indicar cuál' };

  if (!hits.length) hits = db[key].filter(it => name(it) && (name(it).includes(nq) || nq.includes(name(it))));
  if (!hits.length) return { err: 'No encontré ' + tipo + ' con "' + q + '"' };

}
function resumen() {

  const ta = db.tareas.filter(t => !t.hecha);

    + (ta.length ? 'Tareas pendientes: ' + ta.map(t => t.titulo).join(', ') + '.' : 'No tienes tareas pendientes.');
}
function runLocal(text) {

  if ((m = /^(?:completa|completar|termina|marca)\s+(?:como hecha\s+)?(?:la\s+)?(?:tarea\s+)?(.+)/.exec(n))) return done(tools.completar_tarea({ buscar: m[1] }));

    const c = cuando(m[3]); if (!c.fecha && !c.hora) return 'No entendí la nueva fecha. Ejemplo: "mueve la cita dentista al sábado a las 5".';
